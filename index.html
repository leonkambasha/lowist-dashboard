<html lang="en">
<head>

  <title>The Light of the World Foundation</title>

  <!-- Fonts: Poppins for UI, Playfair Display for branding -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    /* ============================================
       CSS VARIABLES — Brand Color System
       These variables are specifically for the LOGIN/AUTH screen.
       The existing dashboard variables are renamed with a '-dash' suffix to avoid conflicts
       and are used only for the dashboard-related styles.
    ============================================ */
    :root {
      /* Brand colors from logo - EXACTLY as specified */
      --teal:        #2F8F8B;
      --teal-light:  #4FAFA8;
      --teal-dim:    rgba(47,143,139,0.12); /* Light transparent version for backgrounds */
      --teal-border: rgba(47,143,139,0.3); /* Slightly stronger transparent version for borders */
      --dark:        #111111;
      --gray:        #2A2A2A;
      --muted:       #6B7280; /* Muted text for light background */
      --faint:       #9CA3AF; /* Faint text/placeholders for light background */
      --bg-page:     #F5F5F5; /* Page background color for login as specified */
      --white:       #FFFFFF;
      --shadow:      0 4px 24px rgba(0,0,0,0.08); /* Soft shadow for form card */
      --shadow-lg:   0 8px 40px rgba(0,0,0,0.12); /* Larger shadow for form card */

      /* Typography for Login/Auth Screen as specified */
      --font-brand:  'Playfair Display', serif; /* Optional for branding */
      --font-ui:     'Poppins', sans-serif; /* General UI elements */
      --font-head:   'Poppins', sans-serif; /* Titles and headings on login */
      --font-body:   'Poppins', sans-serif; /* Body text on login */
      --radius:      12px;
      --radius-sm:   8px;
      --radius-lg:   16px; /* Larger radius for the login box */

      /* Existing Dashboard dark theme variables (renamed to avoid conflict with new brand vars) */
      --bg-dash:          #060d1a;
      --surface-dash:     #0d1b2e;
      --surface2-dash:    #112039;
      --border-dash:      rgba(99,179,237,0.10);
      --border2-dash:     rgba(99,179,237,0.18);
      --accent-dash:      #38bdf8;
      --accent-dim-dash:  rgba(56,189,248,0.12);
      --green-dash:       #22d3a0;
      --green-dim-dash:   rgba(34,211,160,0.12);
      --red-dash:         #f87171;
      --red-dim-dash:     rgba(248,113,113,0.12);
      --amber-dash:       #fbbf24;
      --amber-dim-dash:   rgba(251,191,36,0.12);
      --text-dash:        #e2eff8;
      --muted-dash:       #7fa8c4;
      --faint-dash:       #3a5870;
      --font-head-dash: 'Space Grotesk', sans-serif;
      --font-body-dash: 'DM Sans', sans-serif;
    }

    /* Universal box-sizing and reset margins/paddings */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Body styles apply to the entire document, overridden by #login-screen for login */
    body {
      font-family: var(--font-body-dash); /* Default body font for the entire app */
      background: var(--bg-dash);         /* Default background for the entire app */
      color: var(--text-dash);            /* Default text color for the entire app */
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    /* ============================================
       LOGIN / AUTH SCREEN — Brand Styled
       These styles specifically target the login form and its components
    ============================================ */
    #login-screen {
      position: fixed;
      inset: 0;
      background: var(--bg-page); /* Page background as specified */
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px; /* Padding for responsiveness on smaller screens */
    }

    .login-box {
      background: var(--white); /* White background for the form card */
      border-radius: 20px;     /* Rounded corners */
      box-shadow: var(--shadow-lg); /* Soft shadow */
      padding: 44px 40px 36px; /* Increased padding for better spacing */
      width: 100%;
      max-width: 420px;        /* Max width for the form card */
    }

    /* Logo section */
    .login-logo {
      text-align: center;
      margin-bottom: 28px; /* Spacing below the logo section */
    }

    .login-logo img {
      width: 80px;            /* Sizing for the logo image */
      height: auto;
      margin-bottom: 14px;    /* Spacing between logo image and brand name */
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    /* Fallback SVG logo if image not found (original from your first code) */
    .login-logo .logo-svg-wrap {
      width: 80px;
      height: 80px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-logo .brand-name {
      font-family: var(--font-brand); /* Playfair Display for brand name as specified */
      font-size: 13px;
      font-weight: 600;
      color: var(--dark);     /* Dark color for brand name */
      letter-spacing: 0.5px;
      line-height: 1.4;
      text-align: center;
    }

    .login-logo .brand-sub {
      font-family: var(--font-ui); /* Poppins for sub-brand */
      font-size: 11px;
      color: var(--muted);    /* Muted color for sub-brand */
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .login-title {
      font-family: var(--font-ui); /* Poppins for titles */
      font-size: 20px;
      font-weight: 600;
      color: var(--dark);     /* Dark color for titles */
      margin-bottom: 4px;
      text-align: center;
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--muted);    /* Muted color for subtitles */
      text-align: center;
      margin-bottom: 24px;
    }

    /* Auth mode toggle (Sign In / Sign Up) */
    .auth-mode-toggle {
      display: flex;
      gap: 4px;
      background: var(--bg-page); /* Light background for the toggle container */
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 20px;
    }

    .auth-mode-btn {
      flex: 1;
      padding: 9px;
      border: none;
      background: none;
      border-radius: 6px;
      font-family: var(--font-ui);
      font-size: 13px;
      color: var(--muted);    /* Muted text for inactive buttons */
      cursor: pointer;
      transition: all 0.15s;
      font-weight: 500;
    }

    .auth-mode-btn.active {
      background: var(--white); /* White background for active button */
      color: var(--teal);     /* Teal text for active button */
      border: 1px solid var(--teal-border); /* Teal border for active button */
      box-shadow: 0 1px 4px rgba(0,0,0,0.06); /* Soft shadow for active button */
    }

    /* Method tabs (Email, Phone, Social) */
    .login-tabs {
      display: flex;
      gap: 4px;
      background: var(--bg-page); /* Light background for the tabs container */
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 20px;
    }

    .login-tab {
      flex: 1;
      padding: 8px;
      border: none;
      background: none;
      border-radius: 6px;
      font-family: var(--font-ui);
      font-size: 13px;
      color: var(--muted);    /* Muted text for inactive tabs */
      cursor: pointer;
      transition: all 0.15s;
      font-weight: 500;
    }

    .login-tab.active {
      background: var(--white); /* White background for active tab */
      color: var(--teal);     /* Teal text for active tab */
      border: 1px solid var(--teal-border); /* Teal border for active tab */
      box-shadow: 0 1px 4px rgba(0,0,0,0.06); /* Soft shadow for active tab */
    }

    .login-panel { display: none; }
    .login-panel.active { display: block; }

    /* Inputs */
    .login-input {
      width: 100%;
      background: var(--white); /* White background for inputs */
      border: 1.5px solid #E5E7EB; /* Clean light gray border */
      border-radius: var(--radius-sm);
      color: var(--dark);     /* Dark text color for input values */
      padding: 12px 14px;
      font-family: var(--font-ui);
      font-size: 14px;
      outline: none;
      margin-bottom: 12px;
      transition: border-color 0.15s, box-shadow 0.15s;
      display: block;
    }

    .login-input:focus {
      border-color: var(--teal); /* Teal border on focus as specified */
      box-shadow: 0 0 0 3px var(--teal-dim); /* Soft teal shadow on focus */
    }

    .login-input::placeholder { color: var(--faint); } /* Faint color for placeholders */

    /* Password eye toggle */
    .password-wrap { position: relative; margin-bottom: 12px; }
    .password-wrap .login-input { margin-bottom: 0; padding-right: 44px; }
    .eye-btn {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--faint); cursor: pointer;
      font-size: 18px; display: flex; align-items: center; padding: 4px;
      transition: color 0.15s;
    }
    .eye-btn:hover { color: var(--teal); }

    /* Buttons */
    .login-btn {
      width: 100%;
      padding: 13px;
      border-radius: var(--radius-sm);
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    /* Primary teal button for Email Sign-in */
    .btn-email {
      background: var(--teal); /* Teal background as specified */
      color: var(--white);     /* White text as specified */
      box-shadow: 0 2px 8px rgba(47,143,139,0.25); /* Subtle shadow */
    }
    .btn-email:hover {
      background: var(--teal-light); /* Lighter teal on hover as specified */
      box-shadow: 0 4px 12px rgba(47,143,139,0.35); /* Larger shadow on hover */
      transform: translateY(-1px); /* Slight lift on hover */
    }

    /* Primary teal button for Sign-up */
    .btn-signup {
      background: var(--teal); /* Teal background as specified */
      color: var(--white);     /* White text as specified */
      box-shadow: 0 2px 8px rgba(47,143,139,0.25);
    }
    .btn-signup:hover {
      background: var(--teal-light); /* Lighter teal on hover as specified */
      box-shadow: 0 4px 12px rgba(47,143,139,0.35);
      transform: translateY(-1px);
    }

    /* Google Sign-in button */
    .btn-google {
      background: var(--white); /* White background */
      color: var(--gray);      /* Gray text */
      border: 1.5px solid #E5E7EB; /* Light border */
    }
    .btn-google:hover {
      background: var(--bg-page); /* Light background on hover */
      border-color: #D1D5DB;
    }

    /* Apple Sign-in button */
    .btn-apple {
      background: var(--dark); /* Dark background */
      color: var(--white);     /* White text */
    }
    .btn-apple:hover {
      background: #333;
    }

    /* Phone OTP send button */
    .btn-phone-send {
      background: var(--teal-dim); /* Teal dim background for secondary action */
      color: var(--teal);        /* Teal text */
      border: 1px solid var(--teal-border); /* Teal border */
    }
    .btn-phone-send:hover {
      background: rgba(47,143,139,0.2); /* Slightly darker dim on hover */
    }

    /* Error / success messages */
    .login-error {
      background: #FEF2F2; /* Light red background */
      color: #DC2626;      /* Dark red text */
      border: 1px solid #FECACA; /* Red border */
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }
    .login-error.show { display: block; }

    .login-success {
      background: #F0FDF4; /* Light green background */
      color: #16A34A;      /* Dark green text */
      border: 1px solid #BBF7D0; /* Green border */
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }
    .login-success.show { display: block; }

    #phone-step2 { display: none; }
    #recaptcha-container { margin-bottom: 12px; }

    /* Divider */
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 4px 0 14px;
      color: var(--faint); /* Faint color for divider text */
      font-size: 12px;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #E5E7EB; /* Light gray line */
    }

    /* ============================================
       DASHBOARD — Dark Theme (unchanged from original, adapted to new vars)
       These styles are for the dashboard and are not affected by the login changes.
    ============================================ */
    .sidebar {
      width: 240px; min-height: 100vh; background: var(--surface-dash);
      border-right: 1px solid var(--border-dash); display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; z-index: 100;
    }
    .sidebar-logo { padding: 28px 24px 20px; border-bottom: 1px solid var(--border-dash); }
    .logo-mark { font-family: var(--font-head-dash); font-size: 18px; font-weight: 700; color: var(--accent-dash); letter-spacing: -0.5px; line-height: 1.2; }
    .logo-sub { font-size: 10px; color: var(--muted-dash); letter-spacing: 1px; text-transform: uppercase; margin-top: 3px; opacity: 0.7; }
    .nav { padding: 16px 12px; flex: 1; }
    .nav-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--faint-dash); padding: 8px 12px 4px; margin-top: 8px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); cursor: pointer; color: var(--muted-dash); font-size: 14px; transition: all 0.15s; margin: 2px 0; border: none; background: none; width: 100%; text-align: left; }
    .nav-item i { font-size: 18px; }
    .nav-item:hover { background: var(--accent-dim-dash); color: var(--accent-dash); }
