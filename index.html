<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Student Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ─── Reset & Variables ─────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
:root {
  --cream:      #F7F3ED;
  --cream-dark: #EDE7DC;
  --ink:        #1A1612;
  --ink-mid:    #4A3F35;
  --ink-light:  #8C7B6E;
  --terra:      #C4603A;
  --terra-dim:  rgba(196,96,58,0.10);
  --terra-mid:  rgba(196,96,58,0.22);
  --teal:       #2A7F78;
  --teal-dim:   rgba(42,127,120,0.12);
  --amber:      #D4960A;
  --amber-dim:  rgba(212,150,10,0.12);
  --border:     rgba(26,22,18,0.09);
  --border-mid: rgba(26,22,18,0.15);
  --shadow-sm:  0 1px 3px rgba(26,22,18,0.06), 0 4px 12px rgba(26,22,18,0.04);
  --shadow-md:  0 4px 8px rgba(26,22,18,0.06), 0 16px 40px rgba(26,22,18,0.08);
  --shadow-lg:  0 8px 16px rgba(26,22,18,0.06), 0 32px 72px rgba(26,22,18,0.14);
  --font-head:  'Lora', Georgia, serif;
  --font-body:  'Outfit', sans-serif;
  --r:          14px;
  --r-sm:       8px;
  --sidebar-w:  340px;
}
 
html, body {
  height: 100%;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}
 
/* ─── Layout Shell ──────────────────────────────────── */
.shell {
  display: flex;
  height: 100vh;
  overflow: hidden;
}
 
/* ─── Sidebar ───────────────────────────────────────── */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--ink);
  display: flex;
  flex-direction: column;
  height: 100vh;
  position: relative;
  z-index: 10;
}
 
.sidebar-header {
  padding: 28px 24px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
 
.sidebar-brand {
  font-family: var(--font-head);
  font-size: 20px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.3px;
}
 
.sidebar-brand span {
  color: var(--terra);
}
 
.sidebar-sub {
  font-size: 12px;
  color: rgba(255,255,255,0.35);
  margin-top: 3px;
  letter-spacing: 0.5px;
  font-weight: 400;
}
 
.sidebar-search {
  padding: 16px 20px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
 
.search-wrap {
  display: flex;
  align-items: center;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: var(--r-sm);
  padding: 9px 14px;
  gap: 9px;
}
 
.search-wrap svg {
  width: 15px;
  height: 15px;
  opacity: 0.4;
  flex-shrink: 0;
}
 
.search-wrap input {
  background: none;
  border: none;
  outline: none;
  color: #fff;
  font-family: var(--font-body);
  font-size: 13.5px;
  width: 100%;
}
 
.search-wrap input::placeholder {
  color: rgba(255,255,255,0.28);
}
 
.sidebar-label {
  font-size: 10px;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.25);
  padding: 14px 20px 8px;
  font-weight: 500;
}
 
.student-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 12px 20px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.1) transparent;
}
 
.student-list::-webkit-scrollbar { width: 4px; }
.student-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
 
/* ─── Student Card (sidebar) ────────────────────────── */
.s-card {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 12px 12px;
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: background 0.15s, transform 0.12s;
  margin-bottom: 3px;
  border: 1px solid transparent;
  position: relative;
}
 
.s-card:hover {
  background: rgba(255,255,255,0.05);
}
 
.s-card.active {
  background: var(--terra-dim);
  border-color: rgba(196,96,58,0.22);
}
 
.s-card.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 60%;
  background: var(--terra);
  border-radius: 0 2px 2px 0;
}
 
.s-avatar {
  width: 42px;
  height: 42px;
  border-radius: 12px 12px 6px 6px; /* rounded top corners */
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-head);
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}
 
.s-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
 
.s-info { flex: 1; min-width: 0; }
 
.s-name {
  font-size: 14px;
  font-weight: 500;
  color: rgba(255,255,255,0.9);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
 
.s-dept {
  font-size: 12px;
  color: rgba(255,255,255,0.35);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
 
.s-att-pill {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 99px;
  flex-shrink: 0;
}
 
.att-high { background: rgba(42,127,120,0.18); color: #5ECFC5; }
.att-mid  { background: rgba(212,150,10,0.18); color: #F0B429; }
.att-low  { background: rgba(196,96,58,0.22); color: #E8815E; }
 
/* ─── Main Panel ────────────────────────────────────── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--cream);
}
 
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 32px;
  border-bottom: 1px solid var(--border);
  background: var(--cream);
  flex-shrink: 0;
}
 
.topbar-title {
  font-family: var(--font-head);
  font-size: 18px;
  font-weight: 600;
  color: var(--ink);
}
 
.topbar-meta {
  font-size: 13px;
  color: var(--ink-light);
  display: flex;
  align-items: center;
  gap: 6px;
}
 
.live-dot {
  width: 7px;
  height: 7px;
  background: var(--teal);
  border-radius: 50%;
  animation: pulse 2s infinite;
}
 
@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.85); }
}
 
.content-area {
  flex: 1;
  overflow-y: auto;
  padding: 28px 32px;
  scrollbar-width: thin;
  scrollbar-color: var(--border-mid) transparent;
}
 
/* ─── Empty State ───────────────────────────────────── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 14px;
  color: var(--ink-light);
  text-align: center;
  animation: fadeIn 0.4s ease;
}
 
.empty-icon {
  width: 72px;
  height: 72px;
  border-radius: 20px;
  background: var(--cream-dark);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
}
 
.empty-state h3 {
  font-family: var(--font-head);
  font-size: 20px;
  color: var(--ink-mid);
  font-weight: 600;
}
 
.empty-state p {
  font-size: 14px;
  max-width: 260px;
  line-height: 1.6;
}
 
/* ─── Profile View ──────────────────────────────────── */
.profile-view {
  animation: slideUp 0.32s cubic-bezier(0.22, 1, 0.36, 1);
}
 
@keyframes slideUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
 
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
 
/* Profile hero — the card with rounded top */
.profile-hero {
  background: var(--ink);
  border-radius: var(--r) var(--r) 0 0;
  padding: 36px 36px 0;
  position: relative;
  overflow: hidden;
}
 
.profile-hero::before {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 220px; height: 220px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(196,96,58,0.22) 0%, transparent 70%);
  pointer-events: none;
}
 
.profile-hero::after {
  content: '';
  position: absolute;
  bottom: 0; left: 40px;
  width: 160px; height: 160px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(42,127,120,0.12) 0%, transparent 70%);
  pointer-events: none;
}
 
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,0.45);
  background: none;
  border: none;
  cursor: pointer;
  padding: 6px 0;
  margin-bottom: 24px;
  transition: color 0.15s;
  font-family: var(--font-body);
}
 
.back-btn:hover { color: rgba(255,255,255,0.85); }
 
.back-btn svg { width: 16px; height: 16px; }
 
.hero-inner {
  display: flex;
  align-items: flex-end;
  gap: 28px;
  position: relative;
  z-index: 1;
}
 
.profile-avatar-lg {
  width: 96px;
  height: 96px;
  border-radius: 22px 22px 10px 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-head);
  font-size: 38px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
  overflow: hidden;
  border: 3px solid rgba(255,255,255,0.12);
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  margin-bottom: -1px;
}
 
.profile-avatar-lg img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
 
.hero-text { flex: 1; padding-bottom: 28px; }
 
.hero-name {
  font-family: var(--font-head);
  font-size: 26px;
  font-weight: 700;
  color: #fff;
  line-height: 1.2;
  margin-bottom: 6px;
}
 
.hero-tags {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 8px;
}
 
.hero-tag {
  font-size: 12px;
  font-weight: 500;
  padding: 4px 12px;
  border-radius: 99px;
  letter-spacing: 0.2px;
}
 
.tag-dept  { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.75); }
.tag-id    { background: var(--terra-dim); color: #E8815E; border: 1px solid rgba(196,96,58,0.3); }
.tag-course{ background: var(--teal-dim); color: #5ECFC5; border: 1px solid rgba(42,127,120,0.3); }
 
/* Profile body */
.profile-body {
  background: #fff;
  border-radius: 0 0 var(--r) var(--r);
  margin-bottom: 20px;
  box-shadow: var(--shadow-md);
}
 
/* Quick stats strip */
.quick-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-bottom: 1px solid var(--border);
}
 
.q-stat {
  padding: 20px 20px;
  text-align: center;
  border-right: 1px solid var(--border);
}
 
.q-stat:last-child { border-right: none; }
 
.q-stat-num {
  font-family: var(--font-head);
  font-size: 28px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1;
}
 
.q-stat-num.terra { color: var(--terra); }
.q-stat-num.teal  { color: var(--teal); }
.q-stat-num.amber { color: var(--amber); }
 
.q-stat-label {
  font-size: 11px;
  color: var(--ink-light);
  margin-top: 5px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}
 
/* Sections grid */
.sections-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
}
 
.section-block {
  padding: 24px 24px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
 
.section-block:nth-child(2n) { border-right: none; }
.section-block:nth-last-child(-n+2) { border-bottom: none; }
 
.section-ttl {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.4px;
  color: var(--ink-light);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
 
.section-ttl-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
 
.dot-terra { background: var(--terra); }
.dot-teal  { background: var(--teal); }
.dot-amber { background: var(--amber); }
.dot-ink   { background: var(--ink-mid); }
 
/* Attendance bar */
.att-bar-wrap { margin-bottom: 8px; }
 
.att-bar-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
}
 
.att-pct-big {
  font-family: var(--font-head);
  font-size: 36px;
  font-weight: 700;
  color: var(--ink);
}
 
.att-status-label {
  font-size: 12px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 99px;
}
 
.att-bar-track {
  height: 8px;
  background: var(--cream-dark);
  border-radius: 99px;
  overflow: hidden;
}
 
.att-bar-fill {
  height: 100%;
  border-radius: 99px;
  transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}
 
.att-breakdown {
  display: flex;
  gap: 16px;
  margin-top: 12px;
}
 
.att-b-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--ink-light);
}
 
.att-b-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
}
 
/* Login entries */
.login-entry {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
}
 
.login-entry:last-child { border-bottom: none; }
 
.login-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: var(--teal-dim);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
 
.login-icon svg { width: 15px; height: 15px; color: var(--teal); }
 
.login-time {
  font-size: 13.5px;
  font-weight: 500;
  color: var(--ink);
}
 
.login-ago {
  font-size: 12px;
  color: var(--ink-light);
  margin-top: 1px;
}
 
.login-badge {
  margin-left: auto;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 99px;
  background: var(--teal-dim);
  color: var(--teal);
  font-weight: 600;
}
 
/* Classes today */
.class-item {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
 
.class-item:last-child { border-bottom: none; }
 
.class-time-block {
  text-align: center;
  min-width: 52px;
  flex-shrink: 0;
}
 
.class-time {
  font-family: var(--font-head);
  font-size: 13px;
  font-weight: 600;
  color: var(--terra);
}
 
.class-period {
  font-size: 10px;
  color: var(--ink-light);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
 
.class-vline {
  width: 2px;
  height: 36px;
  background: var(--border-mid);
  border-radius: 2px;
  flex-shrink: 0;
}
 
.class-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
}
 
.class-room {
  font-size: 12px;
  color: var(--ink-light);
  margin-top: 2px;
}
 
.class-status {
  margin-left: auto;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 99px;
  font-weight: 600;
  flex-shrink: 0;
}
 
.cs-upcoming { background: var(--terra-dim); color: var(--terra); }
.cs-done     { background: var(--cream-dark); color: var(--ink-light); }
.cs-now      { background: var(--teal-dim); color: var(--teal); }
 
/* ─── Responsive ────────────────────────────────────── */
@media (max-width: 900px) {
  .shell { flex-direction: column; height: auto; overflow: auto; }
  .sidebar {
    width: 100%;
    height: auto;
    max-height: 45vh;
  }
  .main { overflow: visible; }
  .content-area { overflow: visible; padding: 20px; }
  .quick-stats { grid-template-columns: repeat(2,1fr); }
  .sections-grid { grid-template-columns: 1fr; }
  .section-block { border-right: none; }
  .section-block:nth-last-child(-n+2) { border-bottom: 1px solid var(--border); }
  .section-block:last-child { border-bottom: none; }
  .topbar { padding: 16px 20px; }
}
 
@media (max-width: 560px) {
  .hero-inner { flex-direction: column; align-items: flex-start; gap: 16px; }
  .hero-text { padding-bottom: 0; }
  .profile-hero { padding: 28px 20px 24px; }
  .profile-avatar-lg { width: 76px; height: 76px; font-size: 30px; }
  .hero-name { font-size: 21px; }
  .q-stat-num { font-size: 22px; }
  .att-pct-big { font-size: 28px; }
}
 
/* ─── Animations ────────────────────────────────────── */
.s-card {
  animation: cardIn 0.3s ease both;
}
 
@keyframes cardIn {
  from { opacity: 0; transform: translateX(-8px); }
  to   { opacity: 1; transform: translateX(0); }
}
</style>
</head>

/* ─── State ─────────────────────────────────────────── */
let activeId = null;
let filtered = [...STUDENTS];
 
/* ─── Helpers ───────────────────────────────────────── */
function initials(name) {
  return name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
}
 
function attClass(pct) {
  if (pct >= 80) return 'att-high';
  if (pct >= 65) return 'att-mid';
  return 'att-low';
}
 
function attColor(pct) {
  if (pct >= 80) return '#2A7F78';
  if (pct >= 65) return '#D4960A';
  return '#C4603A';
}
 
function attLabel(pct) {
  if (pct >= 80) return { text: 'Good Standing', cls: 'att-high' };
  if (pct >= 65) return { text: 'At Risk', cls: 'att-mid' };
  return { text: 'Critical', cls: 'att-low' };
}
 
function formatDate() {
  return new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
}
 
/* ─── Render Sidebar List ───────────────────────────── */
function renderList(data) {
  const list = document.getElementById('studentList');
  if (!data.length) {
    list.innerHTML = `<div style="text-align:center;padding:24px 16px;color:rgba(255,255,255,0.3);font-size:13px">No students match your search.</div>`;
    return;
  }
  list.innerHTML = data.map((s, i) => `
    <div class="s-card ${activeId === s.id ? 'active' : ''}"
         onclick="selectStudent('${s.id}')"
         style="animation-delay:${i * 0.04}s">
      <div class="s-avatar" style="background:${s.color}">
        ${initials(s.name)}
      </div>
      <div class="s-info">
        <div class="s-name">${s.name}</div>
        <div class="s-dept">${s.department} · ${s.year}</div>
      </div>
      <span class="s-att-pill ${attClass(s.attendance)}">${s.attendance}%</span>
    </div>
  `).join('');
}
 
/* ─── Render Profile ─────────────────────────────────── */
function renderProfile(s) {
  const lbl = attLabel(s.attendance);
  const col = attColor(s.attendance);
 
  const loginsHTML = s.lastLogins.map((l, i) => `
    <div class="login-entry">
      <div class="login-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
      </div>
      <div>
        <div class="login-time">${l.time}</div>
        <div class="login-ago">${l.device}</div>
      </div>
      ${i === 0 ? '<span class="login-badge">Latest</span>' : `<span style="margin-left:auto;font-size:12px;color:var(--ink-light)">${l.ago}</span>`}
    </div>
  `).join('');
 
  const classesHTML = s.classesToday.map(c => {
    const statusMap = { now: 'In Progress', done: 'Completed', upcoming: 'Upcoming' };
    const clsMap    = { now: 'cs-now', done: 'cs-done', upcoming: 'cs-upcoming' };
    return `
      <div class="class-item">
        <div class="class-time-block">
          <div class="class-time">${c.time}</div>
          <div class="class-period">${c.period}</div>
        </div>
        <div class="class-vline"></div>
        <div>
          <div class="class-name">${c.name}</div>
          <div class="class-room">${c.room}</div>
        </div>
        <span class="class-status ${clsMap[c.status]}">${statusMap[c.status]}</span>
      </div>
    `;
  }).join('');
 
  const nowCount = s.classesToday.filter(c => c.status === 'now').length;
  const upcomingCount = s.classesToday.filter(c => c.status === 'upcoming').length;
 
  return `
    <div class="profile-view">
      <!-- Hero -->
      <div class="profile-hero">
        <button class="back-btn" onclick="goBack()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M19 12H5M12 5l-7 7 7 7"/>
          </svg>
          All Students
        </button>
        <div class="hero-inner">
          <div class="profile-avatar-lg" style="background:${s.color}">
            ${initials(s.name)}
          </div>
          <div class="hero-text">
            <div class="hero-name">${s.name}</div>
            <div class="hero-tags">
              <span class="hero-tag tag-id">${s.id}</span>
              <span class="hero-tag tag-course">${s.course}</span>
              <span class="hero-tag tag-dept">${s.department}</span>
              <span class="hero-tag tag-dept">${s.year}</span>
            </div>
          </div>
        </div>
      </div>
 
      <!-- Profile body -->
      <div class="profile-body">
        <!-- Quick stats -->
        <div class="quick-stats">
          <div class="q-stat">
            <div class="q-stat-num terra">${s.attendance}%</div>
            <div class="q-stat-label">Attendance</div>
          </div>
          <div class="q-stat">
            <div class="q-stat-num teal">${s.gpa}</div>
            <div class="q-stat-label">GPA</div>
          </div>
          <div class="q-stat">
            <div class="q-stat-num amber">${s.classesToday.length}</div>
            <div class="q-stat-label">Classes Today</div>
          </div>
          <div class="q-stat">
            <div class="q-stat-num">${s.credits}</div>
            <div class="q-stat-label">Credits</div>
          </div>
        </div>
 
        <!-- Sections grid -->
        <div class="sections-grid">
          <!-- Attendance -->
          <div class="section-block">
            <div class="section-ttl">
              <div class="section-ttl-dot dot-terra"></div>
              Attendance Record
            </div>
            <div class="att-bar-wrap">
              <div class="att-bar-header">
                <div class="att-pct-big">${s.attendance}%</div>
                <span class="att-status-label ${lbl.cls}">${lbl.text}</span>
              </div>
              <div class="att-bar-track">
                <div class="att-bar-fill" id="attFill" style="width:0%;background:${col}"></div>
              </div>
              <div class="att-breakdown">
                <div class="att-b-item">
                  <div class="att-b-dot" style="background:${col}"></div>
                  ${s.attended} attended
                </div>
                <div class="att-b-item">
                  <div class="att-b-dot" style="background:var(--cream-dark)"></div>
                  ${s.total - s.attended} missed
                </div>
                <div class="att-b-item">
                  <div class="att-b-dot" style="background:var(--border-mid)"></div>
                  ${s.total} total
                </div>
              </div>
            </div>
          </div>
 
          <!-- Last Login -->
          <div class="section-block">
            <div class="section-ttl">
              <div class="section-ttl-dot dot-teal"></div>
              Recent Logins
            </div>
            ${loginsHTML}
          </div>
 
          <!-- Classes Today -->
          <div class="section-block" style="grid-column: 1 / -1">
            <div class="section-ttl">
              <div class="section-ttl-dot dot-amber"></div>
              Today's Schedule
              <span style="margin-left:auto;font-size:11px;color:var(--ink-light);font-weight:400">
                ${nowCount > 0 ? `<span style="color:var(--teal);font-weight:600">${nowCount} now</span> · ` : ''}${upcomingCount} upcoming
              </span>
            </div>
            ${classesHTML}
          </div>
        </div>
      </div>
    </div>
  `;
}
 
/* ─── Interactions ──────────────────────────────────── */
function selectStudent(id) {
  activeId = id;
  const student = STUDENTS.find(s => s.id === id);
  const content = document.getElementById('contentArea');
  const titleEl = document.getElementById('topbarTitle');
 
  titleEl.textContent = student.name;
  content.innerHTML = renderProfile(student);
  renderList(filtered);
 
  // Animate attendance bar after render
  requestAnimationFrame(() => {
    setTimeout(() => {
      const fill = document.getElementById('attFill');
      if (fill) fill.style.width = student.attendance + '%';
    }, 80);
  });
}
 
function goBack() {
  activeId = null;
  const content = document.getElementById('contentArea');
  const titleEl = document.getElementById('topbarTitle');
 
  titleEl.textContent = 'Student Dashboard';
  content.innerHTML = `
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🎓</div>
      <h3>Select a student</h3>
      <p>Click any student from the list to view their full academic profile.</p>
    </div>
  `;
  renderList(filtered);
}
 
function filterStudents(query) {
  const q = query.trim().toLowerCase();
  filtered = q
    ? STUDENTS.filter(s =>
        s.name.toLowerCase().includes(q) ||
        s.department.toLowerCase().includes(q) ||
        s.course.toLowerCase().includes(q) ||
        s.id.toLowerCase().includes(q)
      )
    : [...STUDENTS];
  renderList(filtered);
}
 
/* ─── Init ──────────────────────────────────────────── */
document.getElementById('topbarDate').textContent = formatDate();
renderList(STUDENTS);
</script>
