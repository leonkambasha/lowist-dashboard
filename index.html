  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* ============================================
       CSS VARIABLES — Brand Color System
       These variables are specifically for the LOGIN/AUTH screen
       The existing dashboard variables remain untouched to preserve its dark theme.
    ============================================ */
    :root {
      /* Brand colors from logo */
      --teal:        #2F8F8B;
      --teal-light:  #4FAFA8;
      --teal-dim:    rgba(47,143,139,0.12); /* Light transparent version for backgrounds */
      --teal-border: rgba(47,143,139,0.3); /* Slightly stronger transparent version for borders */
      --dark:        #111111;
      --gray:        #2A2A2A;
      --muted:       #6B7280; /* Muted text for light background */
      --faint:       #9CA3AF; /* Faint text/placeholders for light background */
      --bg-page:     #F5F5F5; /* Page background color for login */
      --white:       #FFFFFF;
      --shadow:      0 4px 24px rgba(0,0,0,0.08); /* Soft shadow for form card */
      --shadow-lg:   0 8px 40px rgba(0,0,0,0.12); /* Larger shadow for form card */

      /* Typography for Login/Auth Screen */
      --font-brand:  'Playfair Display', serif;
      --font-ui:     'Poppins', sans-serif; /* General UI elements */
      --font-head:   'Poppins', sans-serif; /* Titles and headings on login */
      --font-body:   'Poppins', sans-serif; /* Body text on login */
      --radius:      12px;
      --radius-sm:   8px;
      --radius-lg:   16px; /* Larger radius for the login box */

      /* Existing Dashboard dark theme variables (unchanged to avoid conflict) */
      --bg-dash:          #060d1a;
      --surface-dash:     #0d1b2e;
      --surface2-dash:    #112039;
      --border-dash:      rgba(99,179,237,0.10);
      --border2-dash:     rgba(99,179,237,0.18);
      --accent-dash:      #38bdf8;
      --accent-dim-dash:  rgba(56,189,248,0.12);
      --green-dash:       #22d3a0;
      --green-dim-dash:   rgba(34,211,160,0.12);
      --red-dash:         #f87171;
      --red-dim-dash:     rgba(248,113,113,0.12);
      --amber-dash:       #fbbf24;
      --amber-dim-dash:   rgba(251,191,36,0.12);
      --text-dash:        #e2eff8;
      --muted-dash:       #7fa8c4;
      --faint-dash:       #3a5870;
      --font-head-dash: 'Space Grotesk', sans-serif;
      --font-body-dash: 'DM Sans', sans-serif;
    }

    /* Universal box-sizing and reset margins/paddings */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Body styles apply to the entire document, overridden by #login-screen for login */
    body {
      font-family: var(--font-body-dash); /* Default body font for the entire app */
      background: var(--bg-dash);         /* Default background for the entire app */
      color: var(--text-dash);            /* Default text color for the entire app */
      min-height: 100vh;
      display: flex;
      overflow-x: hidden;
    }

    /* ============================================
       LOGIN / AUTH SCREEN — Brand Styled
       These styles specifically target the login form and its components
    ============================================ */
    #login-screen {
      position: fixed;
      inset: 0;
      background: var(--bg-page); /* Page background as specified */
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px; /* Padding for responsiveness on smaller screens */
    }

    .login-box {
      background: var(--white); /* White background for the form card */
      border-radius: 20px;     /* Rounded corners */
      box-shadow: var(--shadow-lg); /* Soft shadow */
      padding: 44px 40px 36px; /* Increased padding for better spacing */
      width: 100%;
      max-width: 420px;        /* Max width for the form card */
    }

    /* Logo section */
    .login-logo {
      text-align: center;
      margin-bottom: 28px; /* Spacing below the logo section */
    }

    .login-logo img {
      width: 80px;            /* Sizing for the logo image */
      height: auto;
      margin-bottom: 14px;    /* Spacing between logo image and brand name */
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    /* Fallback SVG logo styles */
    .login-logo .logo-svg-wrap {
      width: 80px;
      height: 80px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-logo .brand-name {
      font-family: var(--font-brand); /* Playfair Display for brand name */
      font-size: 13px;
      font-weight: 600;
      color: var(--dark);     /* Dark color for brand name */
      letter-spacing: 0.5px;
      line-height: 1.4;
      text-align: center;
    }

    .login-logo .brand-sub {
      font-family: var(--font-ui); /* Poppins for sub-brand */
      font-size: 11px;
      color: var(--muted);    /* Muted color for sub-brand */
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .login-title {
      font-family: var(--font-ui); /* Poppins for titles */
      font-size: 20px;
      font-weight: 600;
      color: var(--dark);     /* Dark color for titles */
      margin-bottom: 4px;
      text-align: center;
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--muted);    /* Muted color for subtitles */
      text-align: center;
      margin-bottom: 24px;
    }

    /* Auth mode toggle (Sign In / Sign Up) */
    .auth-mode-toggle {
      display: flex;
      gap: 4px;
      background: var(--bg-page); /* Light background for the toggle container */
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 20px;
    }

    .auth-mode-btn {
      flex: 1;
      padding: 9px;
      border: none;
      background: none;
      border-radius: 6px;
      font-family: var(--font-ui);
      font-size: 13px;
      color: var(--muted);    /* Muted text for inactive buttons */
      cursor: pointer;
      transition: all 0.15s;
      font-weight: 500;
    }

    .auth-mode-btn.active {
      background: var(--white); /* White background for active button */
      color: var(--teal);     /* Teal text for active button */
      border: 1px solid var(--teal-border); /* Teal border for active button */
      box-shadow: 0 1px 4px rgba(0,0,0,0.06); /* Soft shadow for active button */
    }

    /* Method tabs (Email, Phone, Social) */
    .login-tabs {
      display: flex;
      gap: 4px;
      background: var(--bg-page); /* Light background for the tabs container */
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 20px;
    }

    .login-tab {
      flex: 1;
      padding: 8px;
      border: none;
      background: none;
      border-radius: 6px;
      font-family: var(--font-ui);
      font-size: 13px;
      color: var(--muted);    /* Muted text for inactive tabs */
      cursor: pointer;
      transition: all 0.15s;
      font-weight: 500;
    }

    .login-tab.active {
      background: var(--white); /* White background for active tab */
      color: var(--teal);     /* Teal text for active tab */
      border: 1px solid var(--teal-border); /* Teal border for active tab */
      box-shadow: 0 1px 4px rgba(0,0,0,0.06); /* Soft shadow for active tab */
    }

    .login-panel { display: none; }
    .login-panel.active { display: block; }

    /* Inputs */
    .login-input {
      width: 100%;
      background: var(--white); /* White background for inputs */
      border: 1.5px solid #E5E7EB; /* Clean light gray border */
      border-radius: var(--radius-sm);
      color: var(--dark);     /* Dark text color for input values */
      padding: 12px 14px;
      font-family: var(--font-ui);
      font-size: 14px;
      outline: none;
      margin-bottom: 12px;
      transition: border-color 0.15s, box-shadow 0.15s;
      display: block;
    }

    .login-input:focus {
      border-color: var(--teal); /* Teal border on focus */
      box-shadow: 0 0 0 3px var(--teal-dim); /* Soft teal shadow on focus */
    }

    .login-input::placeholder { color: var(--faint); } /* Faint color for placeholders */

    /* Password eye toggle */
    .password-wrap { position: relative; margin-bottom: 12px; }
    .password-wrap .login-input { margin-bottom: 0; padding-right: 44px; }
    .eye-btn {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--faint); cursor: pointer;
      font-size: 18px; display: flex; align-items: center; padding: 4px;
      transition: color 0.15s;
    }
    .eye-btn:hover { color: var(--teal); }

    /* Buttons */
    .login-btn {
      width: 100%;
      padding: 13px;
      border-radius: var(--radius-sm);
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    /* Primary teal button for Email Sign-in */
    .btn-email {
      background: var(--teal); /* Teal background */
      color: var(--white);     /* White text */
      box-shadow: 0 2px 8px rgba(47,143,139,0.25); /* Subtle shadow */
    }
    .btn-email:hover {
      background: var(--teal-light); /* Lighter teal on hover */
      box-shadow: 0 4px 12px rgba(47,143,139,0.35); /* Larger shadow on hover */
      transform: translateY(-1px); /* Slight lift on hover */
    }

    /* Primary teal button for Sign-up */
    .btn-signup {
      background: var(--teal); /* Teal background */
      color: var(--white);     /* White text */
      box-shadow: 0 2px 8px rgba(47,143,139,0.25);
    }
    .btn-signup:hover {
      background: var(--teal-light); /* Lighter teal on hover */
      box-shadow: 0 4px 12px rgba(47,143,139,0.35);
      transform: translateY(-1px);
    }

    /* Google Sign-in button */
    .btn-google {
      background: var(--white); /* White background */
      color: var(--gray);      /* Gray text */
      border: 1.5px solid #E5E7EB; /* Light borderNo response
